[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-cost-ledger"
version = "0.3.2"
description = "Token/cost ledger for coding agents. Optional debug chat UI. Not a request router."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Wanbinyu" }]
keywords = [
  "agent",
  "cost",
  "token",
  "usage",
  "billing",
  "chat",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pydantic>=2.7.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
]

[project.optional-dependencies]
web = [
  "httpx>=0.27.0",
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
  "python-dotenv>=1.0.0",
]
test = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
  "python-dotenv>=1.0.0",
]

[project.scripts]
cost-ledger = "agent_cost_ledger.cli:app"
usage-chat = "agent_cost_ledger.cli:ui_entry"

[project.urls]
Homepage = "https://github.com/Wanbinyu/agent-cost-ledger"
Repository = "https://github.com/Wanbinyu/agent-cost-ledger"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agent_cost_ledger" = [
  "templates/*.html",
  "static/*.css",
  "static/*.js",
  "data/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
